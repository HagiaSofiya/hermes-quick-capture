<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hermes Quick Capture</title>
  <link rel="icon" type="image/png" href="icons/icon32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img class="logo" src="icons/icon48.png" alt="" width="20" height="20" />
    <span class="title">Hermes Quick Capture</span>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="14" height="14" stroke="currentColor" stroke-width="2"/>
        <rect x="4" y="4" width="8" height="8" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </header>

  <main class="composer">
    <textarea id="composeText" rows="3" placeholder="Type a quick note for your agent…"></textarea>
    <div class="chips" id="destinationChips"></div>
    <button id="sendBtn" class="send-btn">Send</button>
    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <section class="history">
    <div class="history-head">
      <h2>Recent</h2>
      <button id="clearHistory" class="icon-btn" title="Clear history" aria-label="Clear history">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M5.5 4V2.5C5.5 2.22386 5.72386 2 6 2H10C10.2761 2 10.5 2.22386 10.5 2.5V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M3.5 4L4 13.5C4.02 13.87 4.33 14 4.7 14H11.3C11.67 14 11.98 13.87 12 13.5L12.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <ul id="historyList" class="history-list"></ul>
    <p id="historyEmpty" class="history-empty">Nothing sent yet. Select text on any page, or type a note above.</p>
  </section>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
